<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Focus Hub — Daily Planner</title>
  <link rel="stylesheet" href="planner.css">
</head>
<body>
  <div id="app">
    <aside id="timeline-panel">
      <header id="timeline-header">
        <div class="range-control">
          <div class="range-row">
            <span>From</span>
            <div class="stepper">
              <button class="stepper-btn" type="button" data-dir="-1" tabindex="-1" aria-label="Decrease">&#8722;</button>
              <input id="timeline-from" type="text" min="0" max="23" step="1" value="0" inputmode="numeric">
              <button class="stepper-btn" type="button" data-dir="1" tabindex="-1" aria-label="Increase">+</button>
            </div>
          </div>
          <div class="range-row">
            <span>To</span>
            <div class="stepper">
              <button class="stepper-btn" type="button" data-dir="-1" tabindex="-1" aria-label="Decrease">&#8722;</button>
              <input id="timeline-to" type="text" min="1" max="24" step="1" value="24" inputmode="numeric">
              <button class="stepper-btn" type="button" data-dir="1" tabindex="-1" aria-label="Increase">+</button>
            </div>
          </div>
        </div>
        <button id="clear-slots-btn" type="button">Clear all</button>
      </header>
      <div id="timeline-scroll">
        <div id="timeline">
          <div id="hour-axis"></div>
          <div id="slot-layer"></div>
        </div>
      </div>
    </aside>
    <div id="divider" title="Drag to resize"></div>
    <aside id="cards-panel">
      <header id="cards-header">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></svg>
      </header>
      <div id="card-deck"></div>
    </aside>
  </div>
  <script src="theme-data.js"></script>
  <script src="planner.js"></script>
</body>
</html>

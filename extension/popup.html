<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      --bg: #2a2a2a;
      --text-on-accent: #2a2a2a;
      --surface: #333;
      --surface-alt: #383838;
      --surface-hover: #4a4a4a;
      --text: #e0e0e0;
      --text-secondary: #b0b0b0;
      --text-muted: #888;
      --text-label: #bbb;
      --text-subtle: #999;
      --text-site: #ccc;
      --border: #555;
      --border-light: #444;
      --border-subtle: #3a3a3a;
      --accent: #b0b0b0;
      --accent-hover: #909090;
      --danger: #ff4757;
      --danger-hover: #e63946;
      --success: #90ee90;
      --white: #fff;
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 14px;
    }
    .control-group {
      margin-bottom: 12px;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--text-label);
    }
    .control-group label span.value {
      color: var(--text-secondary);
      font-weight: bold;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: var(--surface-alt);
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    select {
      width: 100%;
      padding: 6px 8px;
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .freq-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .freq-row input[type="range"] {
      flex: 1;
    }
    .freq-step {
      width: 36px;
      height: 28px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .freq-step:hover {
      background: var(--surface-hover);
    }
    .freq-step:active {
      background: var(--accent);
      color: var(--text-on-accent);
    }
    #captureBtn {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    #captureTarget {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
      font-weight: normal;
      font-size: 13px;
      opacity: 0.6;
    }
    .capture-action {
      flex-shrink: 0;
      font-weight: bold;
    }
    #captureBtn.start {
      background: var(--accent);
      color: var(--text-on-accent);
    }
    #captureBtn.start:hover {
      background: var(--accent-hover);
    }
    #captureBtn.stop {
      background: var(--danger);
      color: var(--white);
    }
    #captureBtn.stop:hover {
      background: var(--danger-hover);
    }
    #captureBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .top-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .top-row #captureBtn {
      flex: 1;
      min-width: 0;
      margin-bottom: 0;
    }
    #plannerBtn {
      flex-shrink: 0;
      width: 42px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-alt);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    #plannerBtn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }
    #plannerBtn svg {
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .controls { }
    .controls.enabled { }

    input[name="tab"] { display: none; }
    .tab-panel { display: none; }
    #tabTimer:checked ~ .tab-bar label[for="tabTimer"],
    #tabModulation:checked ~ .tab-bar label[for="tabModulation"],
    #tabBlock:checked ~ .tab-bar label[for="tabBlock"],
    #tabThemes:checked ~ .tab-bar label[for="tabThemes"] {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
    #tabSettings:checked ~ .tab-bar label[for="tabSettings"] {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
    #tabTimer:checked ~ #controls #panelTimer { display: block; }
    #tabModulation:checked ~ #controls #panelModulation { display: block; }
    #tabBlock:checked ~ #controls #panelBlock { display: block; }
    #tabThemes:checked ~ #controls #panelThemes { display: block; }
    #tabSettings:checked ~ #controls #panelSettings { display: block; }

    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 12px;
    }
    .tab-label {
      padding: 6px 8px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 13px;
      opacity: 0.6;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s;
      user-select: none;
    }
    .tab-label:hover { color: var(--text-secondary); }
    .tab-label svg { display: block; width: 28px; height: 28px; pointer-events: none; }
    #labelSettings { margin-left: auto; }
    .toggle-row svg { width: 16px; height: 16px; flex-shrink: 0; }

    .preset-grid-btn {
      padding: 5px 8px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      opacity: 0.6;
      font-weight: bold;
      white-space: nowrap;
    }
    .preset-grid-btn:hover { background: var(--surface-hover); }
    .preset-grid-btn:active { background: var(--accent); color: var(--text-on-accent); }

    #presetGrid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
    }

    .section-box {
      margin-bottom: 6px;
      margin-top: 4px;
      padding: 12px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0;
    }
    .section-header label {
      font-size: 12px;
      color: var(--text-label);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-header input[type="checkbox"] {
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }
    .help-icon {
      position: relative;
      cursor: help;
      color: var(--text-muted);
      display: inline-flex;
      opacity: 0.5;
      transition: opacity 0.15s;
    }
    .help-icon:hover { opacity: 1; }
    .help-icon::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      transform: none;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      line-height: 1.4;
      white-space: normal;
      width: 220px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 100;
    }
    .help-icon:hover::after { opacity: 1; }
    .section-sub-controls {
      margin-top: 10px;
      opacity: 0.4;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .section-sub-controls.enabled {
      opacity: 1;
      pointer-events: auto;
    }
    .section-sub-controls label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--text-subtle);
    }
    .section-sub-controls label span.value {
      color: var(--text-secondary);
      font-weight: bold;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      opacity: 0.6;
      color: var(--text-label);
      cursor: pointer;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .toggle-row input[type="checkbox"] {
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .mode-toggle {
      display: flex;
      background: var(--surface-alt);
      border-radius: 6px;
      padding: 2px;
      margin-bottom: 12px;
    }
    .mode-toggle button {
      flex: 1;
      padding: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      opacity: 0.6;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.15s;
    }
    .mode-toggle button.active {
      background: var(--border);
      color: var(--text);
    }

    .block-site-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .block-site-row:last-child { border-bottom: none; }
    .block-site-row input[type="checkbox"] {
      accent-color: var(--accent);
      width: 13px;
      height: 13px;
      cursor: pointer;
    }
    .block-site-row .site-name {
      flex: 1;
      font-size: 12px;
      color: var(--text-site);
    }
    .block-site-row .site-del {
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--danger);
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .block-site-row .site-del:hover {
      background: var(--surface-hover);
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .theme-btn {
      padding: 8px 6px;
      border: 2px solid var(--border);
      background: var(--surface-alt);
      color: var(--text-secondary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 10px;
      font-weight: bold;
      text-align: center;
      transition: all 0.15s;
      min-height: 52px;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      overflow-wrap: break-word;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .theme-btn:hover {
      background: var(--surface-hover);
    }
    .theme-btn.active {
      border-color: var(--accent);
      color: var(--text);
      background: var(--surface);
    }
    .theme-btn .swatch {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      margin-top: 4px;
    }
    .theme-btn.locked {
      opacity: 0.45;
      cursor: not-allowed;
      background: var(--surface-alt);
      color: var(--text-muted);
      font-size: 20px;
      border-color: var(--border-subtle);
      pointer-events: none;
    }
    .theme-btn.locked:hover {
      background: var(--surface-alt);
    }

    .unlock-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0.6;
      font-weight: bold;
      cursor: pointer;
      background: var(--accent);
      color: var(--text-on-accent);
      margin-bottom: 8px;
      transition: all 0.15s;
    }
    .unlock-btn:hover {
      background: var(--accent-hover);
    }
    .unlock-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .unlock-btn.all-unlocked {
      background: var(--success);
      cursor: default;
    }
    .unlock-btn.all-unlocked:hover {
      background: var(--success);
    }

    .add-site-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .add-site-row input {
      flex: 1;
      padding: 6px 8px;
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      opacity: 0.6;
    }
    .add-site-row input:focus { outline: none; border-color: var(--accent); }

    .timer-section {
      padding: 12px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    #timerDisplay {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      color: var(--text-secondary);
      padding: 4px 0 8px;
      font-variant-numeric: tabular-nums;
    }
    .timer-presets {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .timer-presets button {
      flex: 1;
      padding: 6px 2px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      opacity: 0.6;
      font-weight: bold;
    }
    .timer-presets button:hover { background: var(--surface-hover); }
    .timer-presets button:active { background: var(--accent); color: var(--text-on-accent); }
    .timer-actions {
      display: flex;
      gap: 6px;
    }
    .timer-actions input {
      flex: 1;
      padding: 5px 6px;
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      opacity: 0.6;
      width: 50px;
    }
    .timer-actions input:focus { outline: none; border-color: var(--accent); }
    .timer-btn {
      padding: 5px 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      opacity: 0.6;
      font-weight: bold;
      cursor: pointer;
    }
    .timer-btn.primary { background: var(--accent); color: var(--text-on-accent); }
    .timer-btn.danger { background: var(--danger); color: var(--white); }

    #customMinutes::-webkit-inner-spin-button,
    #customMinutes::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    #customMinutes { -moz-appearance: textfield; }
  
  </style>
</head>
<body>
  <input type="radio" name="tab" id="tabTimer" checked>
  <input type="radio" name="tab" id="tabModulation">
  <input type="radio" name="tab" id="tabBlock">
  <input type="radio" name="tab" id="tabThemes">
  <input type="radio" name="tab" id="tabSettings">

  <div class="top-row">
    <button id="captureBtn" class="start">
      <span class="capture-action">Capture</span>
      <span id="captureTarget"></span>
    </button>
    <button id="plannerBtn" title="Open Daily Planner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M3 10h18"/></svg>
    </button>
  </div>

  <div class="tab-bar">
    <label for="tabTimer" class="tab-label" id="labelTimer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>
    </label>
    <label for="tabModulation" class="tab-label" id="labelModulation">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
    </label>
    <label for="tabBlock" class="tab-label" id="labelBlock">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </label>
    <label for="tabThemes" class="tab-label" id="labelThemes">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg>
    </label>
    <label for="tabSettings" class="tab-label" id="labelSettings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
    </label>
  </div>

  <div id="controls" class="controls">
    <div class="tab-panel" id="panelTimer">
      <div class="timer-section">
        <div id="timerDisplay">00:00</div>
        <div id="countdownControls">
          <div class="timer-presets">
            <button class="preset-btn" data-seconds="900">15m</button>
            <button class="preset-btn" data-seconds="1800">30m</button>
            <button class="preset-btn" data-seconds="3600">60m</button>
            <button class="preset-btn" data-seconds="5400">90m</button>
          </div>
          <div class="timer-actions">
            <input type="number" id="customMinutes" min="1" max="90" value="15" placeholder="min">
            <span style="font-size:11px;color:var(--text-muted);margin-left:2px;flex-shrink:0;">min</span>
            <button id="startBtn" class="timer-btn primary">Start</button>
            <button id="stopBtn" class="timer-btn danger" style="display:none">Stop</button>
          </div>
        </div>
      </div>
      <div class="music-row" style="display:flex; margin-top:10px;">
        <button id="playMusicBtn" class="timer-btn" style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px; background:var(--surface-alt); border:1px solid var(--border); color:var(--text-muted); font-size:12px; font-weight:normal; padding:6px 10px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          Focus Music
        </button>
      </div>
    </div>

    <div class="tab-panel" id="panelModulation">
      <div class="section-box">
        <div class="section-header">
          <label>Presets</label>
        </div>
        <div id="presetGrid"></div>
        <div style="display:flex; gap:6px;">
          <input type="text" id="presetNameInput" placeholder="Preset name..." style="flex:1; padding:5px 6px; background:var(--surface-alt); color:var(--text); border:1px solid var(--border); border-radius:6px; font-size:11px;">
          <button id="savePresetBtn" class="timer-btn primary" style="font-size:11px; white-space:nowrap;">Save</button>
        </div>
      </div>

      <div class="control-group">
        <label>Modulator Frequency <span id="freqValue" class="value">16.0 Hz</span></label>
        <div class="freq-row">
          <button class="freq-step" id="freqDown">-1</button>
          <input type="range" id="frequency" min="1" max="50" step="1" value="16">
          <button class="freq-step" id="freqUp">+1</button>
        </div>
      </div>

      <div class="control-group">
        <label>Depth <span id="depthValue" class="value">50%</span></label>
        <input type="range" id="depth" min="0" max="100" step="1" value="50">
      </div>


      <div class="section-box">
        <div class="section-header">
          <label>
            <input type="checkbox" id="spatialEnabled">
            Spatial Movement
          </label>
        </div>
        <div id="spatialControls" class="section-sub-controls">
          <div class="control-group" style="margin-bottom:8px;">
            <label>Speed <span id="spatialSpeedValue" class="value">0.3 Hz</span></label>
            <input type="range" id="spatialSpeed" min="0.1" max="2" step="0.1" value="0.3">
          </div>
          <div class="control-group">
            <label>Width <span id="spatialWidthValue" class="value">70%</span></label>
            <input type="range" id="spatialWidth" min="0" max="100" step="1" value="70">
          </div>
        </div>
      </div>

      <div class="section-box">
        <div class="section-header">
          <label>
            <input type="checkbox" id="crossoverEnabled">
            Filter
          </label>
        </div>
        <div id="crossoverControls" class="section-sub-controls">
          <div class="mode-toggle" style="margin-bottom:8px;">
            <button id="crossoverModeLow" class="active">Low</button>
            <button id="crossoverModeHigh">High</button>
          </div>
          <div class="control-group">
            <label>Threshold <span id="crossoverFreqValue" class="value">300 Hz</span></label>
            <input type="range" id="crossoverFreq" min="50" max="4000" step="10" value="300">
          </div>
        </div>
      </div>

      <div class="section-box">
        <div class="section-header">
          <label>
            <input type="checkbox" id="pinkNoiseEnabled">
            Noise
          </label>
          <label style="margin-left:auto; font-size:11px; color:var(--text-subtle); cursor:pointer; display:flex; align-items:center; gap:4px;">
            <input type="checkbox" id="pinkNoiseModulate">
            Modulate
          </label>
        </div>
        <div id="pinkNoiseControls" class="section-sub-controls">
          <div class="control-group">
            <label>Type</label>
            <select id="noiseType">
              <option value="white">White</option>
              <option value="pink" selected>Pink</option>
              <option value="brown">Brown</option>
              <option value="gray">Gray</option>
            </select>
          </div>
          <div class="control-group">
            <label>Mix <span id="pinkNoiseMixValue" class="value">3%</span></label>
            <input type="range" id="pinkNoiseMix" min="0" max="10" step="0.1" value="3">
          </div>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="panelBlock">
      <label class="toggle-row">
        <input type="checkbox" id="blockEnabled">
        Blocking Active
      </label>
      <div class="mode-toggle">
        <button id="modeReason" class="active">Reason</button>
        <button id="modeBlockBtn">Complete Block</button>
      </div>
      <label class="toggle-row" id="shuffleReasonsRow" style="margin-bottom:8px;">
        <input type="checkbox" id="shuffleReasons"> Shuffle reason buttons
      </label>
      <div class="mode-toggle" style="margin-bottom:8px;">
        <button id="modeBlocklist" class="active">Blocklist</button>
        <button id="modeWhitelist">Whitelist</button>
      </div>
      <div id="blockedSiteList"></div>
      <div class="add-site-row">
        <input type="text" id="newSiteInput" placeholder="example.com">
        <button id="addSiteBtn" class="timer-btn primary" style="font-size:11px; white-space:nowrap;">+ Add</button>
      </div>
      <div class="section-box" style="margin-top:12px;">
        <div class="section-header"><label>Block Page</label></div>
        <div>
          <label class="toggle-row">
            <input type="checkbox" id="showSuggestions" checked> Show alternative suggestions
          </label>
          <div style="margin-top:8px; margin-bottom:6px; display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-label);"><span class="help-icon" data-tooltip="You can use markdown to create custom message for each reason. Every reason should start with # &lt;Reason name&gt; and put your message on new line."><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></span> Text to show after reason choose</div>
          <div style="margin-top:8px;">
            <textarea id="suggestionsEditor" style="width:100%; height:160px; padding:8px; background:var(--surface-alt); color:var(--text); border:1px solid var(--border); border-radius:6px; font-size:11px; font-family:monospace; resize:vertical;"></textarea>
            <div style="display:flex; gap:6px; margin-top:6px;">
              <button id="suggestionsSaveBtn" class="timer-btn primary" style="font-size:10px; padding:4px 12px;">Save</button>
              <button id="suggestionsRestoreBtn" class="timer-btn" style="font-size:10px; padding:4px 12px; background:transparent; border:1px solid var(--border); color:var(--text-muted);">Restore defaults</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="tab-panel" id="panelThemes">
      <div class="section-box">
        <button id="unlockBtn" class="unlock-btn">Roll!</button>
        <div id="themeGrid" class="theme-grid"></div>
      </div>
    </div>
    <div class="tab-panel" id="panelSettings">
      <div class="section-box">
        <div class="section-header"><label>Focus Music</label></div>
        <div style="display:flex; gap:6px; align-items:center;">
          <input type="text" id="musicUrlInput" placeholder="https://youtube.com/watch?v=..." style="flex:1; padding:5px 6px; background:var(--surface-alt); color:var(--text); border:1px solid var(--border); border-radius:6px; font-size:11px;">
          <button id="musicUrlSaveBtn" class="timer-btn primary" style="font-size:11px; white-space:nowrap;">Save</button>
        </div>
        <div style="margin-top:6px; font-size:10px; color:var(--text-subtle);">Opens via the Focus Music button. Bypasses the blocker. Default: lofi hip hop radio.</div>
        <label class="toggle-row" id="launchMusicRow">
          <input type="checkbox" id="launchMusicOnStart"> Open on browser startup
        </label>
      </div>
      <div class="section-box">
        <div class="section-header"><label>Visible Tabs</label></div>
        <div id="tabToggleList">
          <label class="toggle-row" style="margin-bottom:6px;">
            <input type="checkbox" class="tab-toggle" data-tab="timer" checked>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>
            Timer
          </label>
          <label class="toggle-row" style="margin-bottom:6px;">
            <input type="checkbox" class="tab-toggle" data-tab="modulation" checked>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
            Modulation
          </label>
          <label class="toggle-row" style="margin-bottom:6px;">
            <input type="checkbox" class="tab-toggle" data-tab="block" checked>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Blocking
          </label>
          <label class="toggle-row" style="margin-bottom:6px;">
            <input type="checkbox" class="tab-toggle" data-tab="themes" checked>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg>
            Themes
          </label>
        </div>
      </div>
    </div>
</div>

  <script src="theme-data.js"></script>
  <script src="popup.js"></script>
</body>
</html>

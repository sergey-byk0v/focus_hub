<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Gravity Timer — v2 filled terrain + glowing dot</title>
<link rel="stylesheet" href="../../extension/aero.css">
<style>
  body {
    --bg: #242628;
    --surface-card: #363a3c;
    --accent: #5fc98a;
    --accent-soft: rgba(95, 201, 138, 0.18);
    --text: #e9ebe9;
    --text-secondary: #b7bcbc;
    --text-muted: #8d938f;
    --border: #484d4a;
    margin: 0;
    width: 350px; height: 600px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
  }
  .card {
    width: 318px;
    background: var(--surface-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
    position: relative;
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .time { font-size: 40px; font-weight: 600; letter-spacing: 1px; font-variant-numeric: tabular-nums;
          text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .pct  { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums;
          text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  canvas { display: block; width: 318px; height: 210px; }
  .foot { padding: 0 14px 10px; font-size: 11px; color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <canvas id="c"></canvas>
    <div class="overlay">
      <div class="time" id="time">25:00</div>
      <div class="pct" id="pct">0% of course</div>
    </div>
  </div>
  <div class="foot">v2 · filled terrain, big centered countdown · finish always above start</div>
<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const qs = new URLSearchParams(location.search);
const STATIC_P = qs.has('p') ? parseFloat(qs.get('p')) : null;
const STATIC_REM = qs.get('rem') || '11:23';
let seed = parseInt(qs.get('seed') || '12');

const cv = document.getElementById('c');
const dpr = window.devicePixelRatio || 1;
const W = 318, H = 210;
cv.width = W * dpr; cv.height = H * dpr;
const ctx = cv.getContext('2d');
ctx.scale(dpr, dpr);

let pts, cum, total;

function genCourse() {
  const rng = mulberry32(seed);
  const n = 90, mx = 14, dx = (W - 2*mx) / n;
  const baseY = H * 0.74, climb = H * 0.32;
  const maxDy = dx * 1.15;
  let v = [], y = 0;
  for (let i = 0; i <= n; i++) { v.push(y); y += (rng()*2-1) * H*0.05; y *= 0.88; }
  for (let k = 0; k < 2; k++) v = v.map((a,i) => (v[Math.max(0,i-1)] + a*2 + v[Math.min(n,i+1)]) / 4);
  pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const yy = baseY - climb*t + v[i]*(1 - Math.abs(2*t-1)*0.25);
    pts.push({ x: mx + t*(W-2*mx), y: Math.max(H*0.14, Math.min(H-12, yy)) });
  }
  for (let i = 1; i <= n; i++) {
    const d = pts[i].y - pts[i-1].y;
    if (Math.abs(d) > maxDy) pts[i].y = pts[i-1].y + Math.sign(d)*maxDy;
  }
  const target = pts[0].y - climb;
  const i0 = Math.floor(n*0.75), delta = target - pts[n].y;
  if (delta < 0) for (let i = i0; i <= n; i++) pts[i].y += delta * ((i-i0)/(n-i0)) * 0.9;
  cum = [0]; total = 0;
  for (let i = 1; i <= n; i++) {
    total += Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
    cum.push(total);
  }
}

function posAt(p) {
  const d = p * total;
  let i = 1; while (i < cum.length && cum[i] < d) i++;
  const a = pts[i-1], b = pts[i];
  const f = (d - cum[i-1]) / (cum[i]-cum[i-1] || 1);
  return { x: a.x + (b.x-a.x)*f, y: a.y + (b.y-a.y)*f };
}

function draw(p) {
  ctx.clearRect(0, 0, W, H);
  const acc = '#5fc98a';

  // filled terrain silhouette
  const grad = ctx.createLinearGradient(0, H*0.2, 0, H);
  grad.addColorStop(0, 'rgba(95,201,138,0.28)');
  grad.addColorStop(1, 'rgba(95,201,138,0.04)');
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.lineTo(pts[pts.length-1].x, H); ctx.lineTo(pts[0].x, H); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  // glowing top edge
  ctx.save();
  ctx.shadowColor = acc; ctx.shadowBlur = 6;
  ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath();
  pts.forEach((q,i) => i ? ctx.lineTo(q.x,q.y) : ctx.moveTo(q.x,q.y));
  ctx.stroke();
  ctx.restore();

  // start marker
  ctx.strokeStyle = 'rgba(233,235,233,0.45)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, 4, 0, Math.PI*2); ctx.stroke();

  // finish flag
  const f = pts[pts.length-1];
  ctx.strokeStyle = acc; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x, f.y-16); ctx.stroke();
  ctx.fillStyle = acc;
  ctx.beginPath(); ctx.moveTo(f.x, f.y-16); ctx.lineTo(f.x+10, f.y-12.5); ctx.lineTo(f.x, f.y-9); ctx.closePath(); ctx.fill();

  // travelling dot
  const q = posAt(p);
  ctx.save();
  ctx.shadowColor = acc; ctx.shadowBlur = 12;
  ctx.fillStyle = acc;
  ctx.beginPath(); ctx.arc(q.x, q.y, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(q.x, q.y, 1.6, 0, Math.PI*2); ctx.fill();
}

const timeEl = document.getElementById('time'), pctEl = document.getElementById('pct');
function fmt(sec){ sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }

function renderFrame(p, remSec) {
  timeEl.textContent = STATIC_P !== null ? fmt(25*60*(1-p)) : fmt(remSec);
  pctEl.textContent = Math.round(p*100) + '% of course';
  draw(p);
}

if (STATIC_P !== null) {
  genCourse();
  renderFrame(STATIC_P, 0);
} else {
  let start = performance.now();
  const DEMO = 12000, TOTAL = 25*60;
  genCourse();
  (function loop(now){
    const p = ((now - start) % DEMO) / DEMO;
    if (((now - start) / DEMO | 0) !== ((now - start - 16) / DEMO | 0)) { seed++; genCourse(); }
    renderFrame(p, TOTAL*(1-p));
    requestAnimationFrame(loop);
  })(start);
}
</script>
</body>
</html>
